services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================
  pg_db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: "medisupply-db"
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "medisupply-pass"
      POSTGRES_ROOT_PASSWORD: "medisupply-pass"
    networks:
      - integration-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d medisupply-db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    networks:
      - integration-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pubsub-emulator:
    image: google/cloud-sdk:latest
    command: >
      sh -c "gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=medisupply-474421"
    networks:
      - integration-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 3s bash -c '</dev/tcp/localhost/8085' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  pubsub-init:
    image: google/cloud-sdk:latest
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=medisupply-474421
      - PUBSUB_CONFIG_FILE=/config/pubsub-config.json
    volumes:
      - ./scripts/init-pubsub.sh:/init-pubsub.sh
      - ./scripts/pubsub-config.json:/config/pubsub-config.json
      - ./scripts/pubsub-init-healthcheck.sh:/healthcheck.sh
    entrypoint: ["/bin/bash", "/init-pubsub.sh"]
    networks:
      - integration-network
    depends_on:
      pubsub-emulator:
        condition: service_healthy
      order-command-handler:
        condition: service_started
      order-query-projection:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s

  # ============================================================================
  # ORDERS MICROSERVICES (CQRS)
  # ============================================================================
  order-command-api:
    build:
      context: ./src/ordenes/commands/api
      dockerfile: Dockerfile
    image: ${GCP_REGISTRY:-us-central1-docker.pkg.dev}/${GCP_PROJECT_ID:-medisupply-474421}/medisupply/ordenes-commands-api:${IMAGE_TAG:-latest}
    command: ["fastapi", "run", "main.py", "--port", "3000"]
    environment:
      - GOOGLE_CLOUD_PROJECT_ID=medisupply-474421
      - PUBSUB_TOPIC_NAME=create-order-command
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - DATABASE_URL=postgresql://root:medisupply-pass@pg_db:5432/medisupply-db
    networks:
      - integration-network
    depends_on:
      pg_db:
        condition: service_healthy
      pubsub-emulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; import json; response = urllib.request.urlopen('http://localhost:3000/health'); data = json.loads(response.read().decode()); exit(0 if data.get('status') == 'healthy' else 1)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  order-command-handler:
    build:
      context: ./src/ordenes/commands/handlers
      dockerfile: Dockerfile
    image: ${GCP_REGISTRY:-us-central1-docker.pkg.dev}/${GCP_PROJECT_ID:-medisupply-474421}/medisupply/ordenes-commands-handlers:${IMAGE_TAG:-latest}
