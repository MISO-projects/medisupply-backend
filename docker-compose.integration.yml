  # ============================================================================
  # NEWMAN TEST RUNNER
  # ============================================================================
  newman:
    image: postman/newman:6-alpine
    volumes:
      - ./collection:/etc/newman
      - ./newman-results:/newman-results
    command: >
      run /etc/newman/medisupply-tests.postman_collection.json
      --env-var bff_web_url=http://bff-web:3000
      --env-var bff_movil_url=http://bff-movil:3000
      --reporters cli,json
      --reporter-json-export /newman-results/newman-results.json
      --color on
      --bail
    networks:
      - integration-network
    depends_on:
      bff-web:
        condition: service_healthy
      bff-movil:
        condition: service_healthy
      pubsub-init:
        condition: service_healthy

networks:
  integration-network:
    driver: bridge

